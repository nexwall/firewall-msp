# Nexwall consolidated log viewer - extra file-based inputs
# These flow through the default ruleset, so they're picked up by the
# same *.* forwarder that already ships everything to VictoriaLogs.
module(load="imfile")

input(type="imfile" File="/var/log/snort/0_alert_json.txt" Tag="snort-ips:" Severity="warning" Facility="local6")
input(type="imfile" File="/var/log/snort/1_alert_json.txt" Tag="snort-ips:" Severity="warning" Facility="local6")
input(type="imfile" File="/var/log/snort/2_alert_json.txt" Tag="snort-ips:" Severity="warning" Facility="local6")
input(type="imfile" File="/var/log/snort/3_alert_json.txt" Tag="snort-ips:" Severity="warning" Facility="local6")

# DPI (netifyd) block/log decisions - structured JSON, one file per
# 60s interval (see /etc/netifyd/netify-proc-flow-actions.json "log" target).
# This is the real decision log; do NOT tail netifyd's own stderr/syslog
# output for this tab, it's mostly bootstrap/licensing noise.
input(type="imfile"
      File="/var/run/netifyd/dpi-actions-*.json"
      Tag="dpi-block:"
      Severity="notice"
      Facility="local6")
