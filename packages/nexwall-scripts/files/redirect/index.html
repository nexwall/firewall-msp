<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexwall Firewall</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--accent:#4f46e5}
@media (prefers-color-scheme:dark){:root{--bg:#030712;--card:#111827;--text:#f3f4f6;--muted:#9ca3af;--accent:#818cf8}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{background:var(--card);border-radius:12px;padding:32px;max-width:460px;margin:16px;box-shadow:0 4px 24px rgba(0,0,0,.12)}
h1{font-size:20px;margin:0 0 12px;letter-spacing:.12em}
p{color:var(--muted);line-height:1.5;margin:8px 0}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
<h1>NEXWALL</h1>
<p id="msg">Opening the secure address of this firewall...</p>
<p id="links" hidden></p>
</main>
<script>
// The secure address has a certificate that every browser trusts. It only works for a computer that asks this firewall
// for names (the usual case); anything else gets the direct link instead of a dead end.
var T = {
  en: ['Opening the secure address of this firewall...', 'The secure address could not be reached from this computer (it needs to use this firewall as DNS server). Open the firewall directly; the browser will warn about the certificate:', 'Open'],
  es: ['Abriendo la dirección segura de este firewall...', 'No se pudo llegar a la dirección segura desde este equipo (debe usar este firewall como servidor DNS). Abra el firewall directamente; el navegador avisará sobre el certificado:', 'Abrir'],
  pt: ['Abrindo o endereço seguro deste firewall...', 'Não foi possível alcançar o endereço seguro a partir deste computador (ele precisa usar este firewall como servidor DNS). Abra o firewall diretamente; o navegador vai avisar sobre o certificado:', 'Abrir']
};
var l = (navigator.language || 'en').slice(0, 2); var t = T[l] || T.en;
document.documentElement.lang = T[l] ? l : 'en';
document.getElementById('msg').textContent = t[0];
var canon = 'https://firewall.lan.nexwall.com.br/';
var direct = 'https://' + location.host + '/';
function fallback() {
  document.getElementById('msg').textContent = t[1];
  var p = document.getElementById('links'); p.hidden = false;
  var a = document.createElement('a'); a.href = direct; a.textContent = t[2] + ' ' + direct; p.appendChild(a);
}
if (!window.fetch || !window.AbortController) { fallback(); }
else {
  var c = new AbortController(); var timer = setTimeout(function () { c.abort(); }, 3000);
  fetch(canon + 'favicon.svg', {mode: 'no-cors', cache: 'no-store', signal: c.signal})
    .then(function () { clearTimeout(timer); location.replace(canon); })
    .catch(function () { clearTimeout(timer); fallback(); });
}
</script>
</body>
</html>
