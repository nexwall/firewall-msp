# ns-stats configuration
#
# proc-ns-stats depends on the proprietary aggregator plugin
# (netify-proc-aggregator), not yet part of this image - see
# msp/DPI_PLAN.md in the internal repo. This config is installed ready for
# when it lands; until then the plugin library is missing. Expected to be a
# non-fatal, skipped-with-a-log-message condition based on the agent's
# documented behavior for other plugins, but not yet specifically verified
# for this one - check this when the aggregator lands.
##############################################################################

[proc-ns-stats]
enable = yes
plugin_library = ${path_plugin_libdir}/libnetify-proc-aggregator.so.0.0.0
conf_filename = ${path_state_persistent}/netify-ns-stats-proc.json

[sink-ns-stats]
enable = yes
plugin_library = ${path_plugin_libdir}/libnetify-sink-http.so.0.0.0
conf_filename = ${path_state_persistent}/netify-ns-stats-sink.json

