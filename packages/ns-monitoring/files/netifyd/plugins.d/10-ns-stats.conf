# ns-stats configuration
#
# proc/sink are Nexwall's own plugins. nx-proc-aggregator's canonical
# source lives in the private nexwall/netify-plugins-pro repo (genuinely
# proprietary), vendored into the netifyd package to build - see
# msp/DPI_PLAN.md in the internal repo. sink-ns-stats reuses the same
# nx-sink-http plugin as ns-flows (see 10-ns-flows.conf).
##############################################################################

[proc-ns-stats]
enable = yes
plugin_library = ${path_plugin_libdir}/libnx-proc-aggregator.so
conf_filename = ${path_state_persistent}/netify-ns-stats-proc.json

[sink-ns-stats]
enable = yes
plugin_library = ${path_plugin_libdir}/libnx-sink-http.so
conf_filename = ${path_state_persistent}/netify-ns-stats-sink.json

