# ns-stats configuration
#
# Disabled until the proprietary aggregator plugin (netify-proc-aggregator)
# actually ships - see msp/DPI_PLAN.md in the internal repo.
#
# Found live, the hard way: a missing plugin_library is NOT a skipped/
# logged-and-continue condition as hoped, it is a fatal exception that
# crashes the whole netifyd instance (confirmed in the log: "Fatal
# exception: proc-ns-stats: Error loading shared library
# .../libnetify-proc-aggregator.so.0.0.0: No such file or directory"),
# taking the working flows pipeline down with it in a crash-restart loop.
# So this section must stay disabled, not just "installed ready", until the
# real plugin is actually present on the image - re-enabling this file
# without the .so being installed will break the agent entirely again.
#
# sink-ns-stats uses Nexwall's own sink plugin (see 10-ns-flows.conf),
# reusable for any JSON-configured HTTP target, and can stay enabled - it
# is proc-ns-stats specifically that has no library to load yet.
##############################################################################

[proc-ns-stats]
enable = no
plugin_library = ${path_plugin_libdir}/libnetify-proc-aggregator.so.0.0.0
conf_filename = ${path_state_persistent}/netify-ns-stats-proc.json

[sink-ns-stats]
enable = yes
plugin_library = ${path_plugin_libdir}/libnx-sink-http.so
conf_filename = ${path_state_persistent}/netify-ns-stats-sink.json

