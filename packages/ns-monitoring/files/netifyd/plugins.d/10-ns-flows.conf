# ns-flows configuration
#
# proc/sink are Nexwall's own plugins (open-source equivalents of the
# proprietary proc-core/sink-http, not buildable against this engine version
# - see msp/DPI_PLAN.md in the internal repo), not the real Netify ones.
##############################################################################

[proc-ns-flows]
enable = yes
plugin_library = ${path_plugin_libdir}/libnx-proc-flows.so
conf_filename = ${path_state_persistent}/netify-ns-flows-proc.json

[sink-ns-flows]
enable = yes
plugin_library = ${path_plugin_libdir}/libnx-sink-http.so
conf_filename = ${path_state_persistent}/netify-ns-flows-sink.json

