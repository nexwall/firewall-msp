[netifyd]
profile = /etc/netifyd/profiles.d/00-default.conf
path_state_volatile = /var/run/netifyd
path_state_persistent = /etc/netifyd
path_pid_file = ${path_state_volatile}/netifyd.pid
path_shared_data = /usr/share/netifyd
path_license_manager = /usr/lib/libnetify-plm.so
auto_informatics = no

[socket]
# Local stream of flow events, read by ns-dpi-bridge (interim, until the
# native Nexwall plugins land; see msp/DPI_PLAN.md in the internal repo).
listen_path[0] = /var/run/netifyd/netifyd.sock
dump_established_flows = yes
dump_unknown_flows = yes
