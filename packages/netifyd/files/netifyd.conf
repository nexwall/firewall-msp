[netifyd]
# Upload of flow metadata to the analytics service. Managed by
# "netifyd --enable-sink" / "--disable-sink" (Traffic Analytics page).
enable_sink = no
url_sink = https://services.nexwall.com.br/v1/provision/

[socket]
# Local stream of flow events, read by ns-dpi-bridge.
listen_path[0] = /var/run/netifyd/netifyd.sock
dump_established_flows = yes
dump_unknown_flows = yes

[protocols]
all = include
