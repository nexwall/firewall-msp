# Feeds ns.talkers ("Top consumers" in the UI) via sink-log - a separate
# instance from proc-ns-stats (ns-monitoring's own pipeline), matching the
# real NethSecurity design: two independent proc-aggregator instances,
# same plugin binary, different config and target.
##############################################################################

[proc-aggregator]
enable = yes
plugin_library = ${path_plugin_libdir}/libnx-proc-aggregator.so
conf_filename = ${path_state_persistent}/netify-proc-aggregator.json

