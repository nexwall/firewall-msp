# Example loopback PCAP capture source
##############################################################################
[capture-interface-lo]
enable = false
capture_type = pcap
role = lan
# How many packets to batch process?
queue_size = 128
# Kernel packet buffer size in MB
buffer_size = 64
# Playback a capture file for testing
# filename = test.pcap
# Example addresses to consider as local
address[0] = 172.16.100.0/24
address[1] = 172.16.101.0/24

