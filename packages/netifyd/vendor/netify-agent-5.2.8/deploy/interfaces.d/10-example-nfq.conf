# Example Netfilter QUEUE capture source
##############################################################################
[capture-interface-nfq0]
enable = false
capture_type = nfqueue
role = lan|wan
queue_id = 0
queue_instances = 2
conntrack_counters = true
# Set verdict: accept, repeat
verdict = accept
mark = 0x10000000
mask = 0xf0000000

