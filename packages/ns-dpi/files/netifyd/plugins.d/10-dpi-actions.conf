# DPI blocking/QoS enforcement configuration
#
# proc-flow-actions is Nexwall's own plugin. Its canonical source lives in
# the private nexwall/netify-plugins-pro repo (genuinely proprietary),
# vendored into the netifyd package to build - see msp/DPI_PLAN.md in the
# internal repo. conf_filename is the file dpi-config (this package,
# unmodified original NethSecurity code) already writes.
##############################################################################

[proc-flow-actions]
enable = yes
plugin_library = ${path_plugin_libdir}/libnx-proc-flow-actions.so
conf_filename = ${path_state_persistent}/netify-proc-flow-actions.json

